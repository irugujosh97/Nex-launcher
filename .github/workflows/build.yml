name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q NexLauncher.zip
      - name: Build debug APK
        working-directory: NexLauncher
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        working-directory: NexLauncher
        run: |
          grep -E "^e: |^\* What went wrong|^> " build.log | head -10 | sed 's/^/::error::/'
      - uses: actions/upload-artifact@v4
        with:
          name: NexLauncher-apk
          path: NexLauncher/app/build/outputs/apk/debug/*.apk
